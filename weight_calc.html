<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="max-w-5xl mx-auto px-6 pb-16">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">Weight</h3>
          <p class="text-sm text-slate-500 mt-1">Kilograms to Pounds</p>

          <label
            for="kg-input"
            class="block text-sm font-medium text-slate-700 mt-5 mb-2"
          >
            Kilograms
          </label>
          <input
            id="kg-input"
            type="text"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-red-500 focus:outline-none"
          />

          <button
            id="kg-button"
            class="w-full mt-4 rounded-lg bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700 transition cursor-pointer"
          >
            Convert
          </button>
          <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
            <p class="text-xs uppercase tracking-wide text-slate-500">Pounds</p>
            <p id="kg-result" class="text-2xl font-bold text-red-600 mt-1">
              0.00
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="WeightCalcLogic.js"></script>
  </body>
</html>
