<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 dark:bg-gray-800 min-h-screen flex flex-col">

  <header class="bg-white dark:bg-gray-700 border-b border-slate-200 dark:border-gray-600">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-bold text-slate-900 dark:text-slate-300">
        Unit Converter
      </h1>
      <span
        class="text-xs font-semibold text-blue-700 bg-blue-100 px-3 py-1 rounded-full dark:text-blue-100 dark:bg-blue-700">
        CPRG 306 &middot; Assignment 1
      </span>
    </div>
  </header>

  <section class="max-w-5xl mx-auto px-6 pt-12 pb-8 text-center">
    <h2 class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white">
      Unit Conversion Calculator
    </h2>
    <p class="text-base text-slate-600 dark:text-slate-300 mt-3 max-w-xl mx-auto">
      Tool for common unit conversions
    </p>
  </section> 

<main class="max-w-5xl mx-auto px-6 pb-16 mt-6 sm:mt-10 lg:mt-16 flex-grow">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="text-center bg-white dark:bg-gray-700 rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">
            Weight
            </h3>

            <button onclick="window.location.href='weight_calc.html'"
            class="w-full h-14 mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 transition cursor-pointer inline-flex items-center justify-center">
            Convert Kilograms to Pounds
            </button>
        </div>
        
        <div class="text-center bg-white dark:bg-gray-700 rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">
            Distance
            </h3>

            <button onclick="window.location.href='distance_calc.html'"
            class="w-full h-14 mt-4 rounded-lg bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700 transition cursor-pointer inline-flex items-center justify-center">
            Convert Kilometers to Miles
            </button>
        </div>

        <div class="text-center bg-white dark:bg-gray-700 rounded-2xl shadow-md p-6">
            <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">
            Volume
            </h3>

            <button onclick="window.location.href='volume_calc.html'"
            class="w-full h-14 mt-4 rounded-lg bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-700 transition cursor-pointer inline-flex items-center justify-center">
            Convert Liters to Gallons
            </button>
        </div>

    </div>
  </main>

  <footer class="bg-white dark:bg-gray-700 border-t border-slate-200 dark:border-gray-600">
    <div class="max-w-5xl mx-auto px-6 py-6 text-center">
      <p class="text-sm text-slate-500 dark:text-slate-300">
        Developed by Doug, Daniel, Caelan, and Niko &middot; CPRG 306 Web
        Development 2 Group 4
      </p>
    </div>
  </footer>

    <script src="main.js"></script>
</body>

</html>
